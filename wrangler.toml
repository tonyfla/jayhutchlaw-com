# Local preview:  npx wrangler pages dev .
# Secrets for local runs go in .dev.vars (gitignored), not in this file.
name = "jayhutchlaw"
compatibility_date = "2026-09-09"
pages_build_output_dir = "."

[vars]
CLIO_REGION = "us"
# CLIO_GROW_TOKEN is a secret — never put it here.

# --- R2 (citation uploads) — deliberately not declared right now ----------
# A Pages build validates every binding in this file before it will publish
# the Function, so declaring [[r2_buckets]] here fails the whole deployment
# outright until the bucket actually exists in the account. functions/api/
# lead.js already treats it as optional (checks env.UPLOADS before use): a
# form still submits and still reaches Clio Grow without this bound, only a
# file attachment fails, with a per-file error rather than a crash.
#
# Before this matters for real (i.e. before launch, or to test uploads on
# this deployment): create the bucket, then uncomment the block below and
# add the same binding under Settings -> Bindings in the dashboard.
#
#   npx wrangler r2 bucket create jayhutchlaw-uploads
#
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "jayhutchlaw-uploads"

# --- Not declarable here -----------------------------------------------
# A Pages build rejects both of these in wrangler.toml outright:
#   - "Configuration file for Pages projects does not support 'send_email'"
#   - "ratelimits": unexpected top-level field (warning, but never wired up)
# functions/api/lead.js already treats both as optional (env.EMAIL and
# env.LEAD_RATE_LIMITER are checked before use), so the site runs fine
# without them - the email fallback and per-IP rate limit just stay off
# until added another way:
#   Settings -> Bindings -> Add, if the dashboard offers an Email Bindings
#   or Rate Limiting option for Pages Functions on this account. If it does
#   not, those two features may need a standalone Worker instead of a Pages
#   Function - Workers support both today; Pages' feature set lags.
